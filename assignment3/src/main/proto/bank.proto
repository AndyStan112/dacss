syntax = "proto3";

package grpc;

option java_multiple_files = true;

service BankService {
  rpc AddAmount (AmountRequest) returns (BalanceResponse);
  rpc WithdrawAmount (AmountRequest) returns (BalanceResponse);
  rpc TransferAmount (TransferRequest) returns (TransferResponse);
  rpc GetBalance (BalanceRequest) returns (BalanceResponse);
}

message AmountRequest {
  string account_id = 1;
  double amount = 2;
}

message TransferRequest {
  string from_account_id = 1;
  string to_account_id = 2;
  double amount = 3;
}

message BalanceRequest {
  string account_id = 1;
}

message BalanceResponse {
  string account_id = 1;
  double balance = 2;
  string message = 3;
}

message TransferResponse {
  string from_account_id = 1;
  string to_account_id = 2;
  double from_balance = 3;
  double to_balance = 4;
  string message = 5;
}